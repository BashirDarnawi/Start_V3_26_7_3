name: Publish verified Docker image

on:
  workflow_dispatch:
    inputs:
      publish_latest:
        description: Also move bashird/albayan:latest to this verified build
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-production-image
  cancel-in-progress: false

jobs:
  verify-and-publish:
    name: Test, smoke-check, and publish
    runs-on: ubuntu-latest
    environment: production
    # A throwaway PostgreSQL 16 (production's database) for the money race
    # scenarios; same as CI's postgres-migration job and `npm run test:postgres`.
    # "5432/tcp" publishes it on a random runner port.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: albayan_test_release
          POSTGRES_USER: albayan
          POSTGRES_PASSWORD: release-check-only-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U albayan -d albayan_test_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: npm ci
      - run: python -m pip install -r server/requirements.txt
      - name: Run all fast safety tests
        run: npm test
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Run critical desktop, Android-size, and iPhone browser flows
        run: npm run test:e2e
      - name: Build and verify generated application files
        run: |
          npm run build
          npm run sync:www
          npm run verify:generated
      - name: Migrate the throwaway PostgreSQL 16 database
        env:
          DATABASE_URL: postgresql+psycopg://albayan:release-check-only-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/albayan_test_release
        run: |
          python -m alembic upgrade head
          python -m alembic current
      - name: Prove the money race scenarios on real PostgreSQL
        env:
          ALBAYAN_TEST_POSTGRES_URL: postgresql+psycopg://albayan:release-check-only-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/albayan_test_release
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider -rs server/test_postgres_financial_review.py | tee "$RUNNER_TEMP/postgres-release.log"
          # A skipped scenario proves nothing; the release must show they ran.
          if grep -Eq '[0-9]+ (skipped|deselected)' "$RUNNER_TEMP/postgres-release.log"; then
            echo "::error::PostgreSQL scenarios were skipped; no image is built."
            exit 1
          fi
      - name: Build immutable release image
        env:
          IMAGE: bashird/albayan
        run: >-
          docker build
          --build-arg ALBAYAN_BUILD_SHA=${{ github.sha }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          --tag "$IMAGE:${{ github.sha }}"
          --tag "$IMAGE:latest"
          --file server/Dockerfile .
      - name: Smoke-test the exact image before publishing
        env:
          IMAGE: bashird/albayan
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name albayan-release-check \
            --publish 127.0.0.1:18080:8000 \
            --env ALBAYAN_COOKIE_SECURE=false \
            --env ALBAYAN_ALLOW_SQLITE=true \
            --env ALBAYAN_DB_PATH=/tmp/albayan-release-check.db \
            "$IMAGE:${{ github.sha }}"
          trap 'docker rm --force albayan-release-check >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/api/health/ready >/dev/null; then
              exit 0
            fi
            if [[ "$attempt" == 30 ]]; then
              docker logs albayan-release-check
              exit 1
            fi
            sleep 1
          done
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish immutable SHA image
        run: docker push "bashird/albayan:${{ github.sha }}"
      - name: Publish latest image
        if: ${{ inputs.publish_latest }}
        run: docker push bashird/albayan:latest
      - name: Release summary
        run: |
          echo "### Docker image published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Immutable: \`bashird/albayan:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Latest updated: \`${{ inputs.publish_latest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Jelastic deployment is intentionally a separate manual approval step." >> "$GITHUB_STEP_SUMMARY"
