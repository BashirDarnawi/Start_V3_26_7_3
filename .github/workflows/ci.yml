name: CI

on:
  push:
    # Branches only. A release-* tag points at a commit CI already proved on its
    # branch; the publish workflow reuses that run instead of testing twice.
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:architecture
      - run: npm run test:mobile-config
      - run: npm run test:build-safety
      - run: npm run test:review-regressions
      - run: npm run test:session-regressions
      - run: npm run test:social-native-regressions
      - run: npm run test:import-boundaries
      - run: npm run test:profitability
      - run: npm run test:system-boundaries
      - run: npm run test:clothes-submit-boundaries
      - run: npm run test:sync-persistence-work
      - run: npm run test:render-performance
      - name: Existing data must also receive current behavior
        run: npm run test:legacy-data
      - name: Run permission and browser-state tests
        run: npm run test:js
      - name: Run phone and responsive UI tests
        run: npm run test:mobile-ui
      - name: Keep compact summaries and permission-safe previews correct
        run: npm run test:design-shell
      - name: Run financial invariants
        run: npm run test:money
      - run: npm run build
      - run: npm run sync:www
      - run: npm run verify:generated
      - run: npx cap copy
      - name: Native bundled files must also match the reviewed source
        run: npm run verify:mobile
      - name: Generated files must be committed
        run: git diff --exit-code -- script.js studio.js clothes.js assets/tailwind.css www
      - name: Dependencies must have no known high-severity vulnerability
        run: npm audit --audit-level=high

  browser-e2e:
    # One `playwright test` run per leg: each leg gets its own runner, its own
    # disposable server and database (scripts/start-e2e-server.js), so legs
    # never share state. The Android-size project carries every full-matrix
    # studio journey and is split into three shards (whole spec files per
    # shard; order inside a file is preserved). Never raise workers above 1 or
    # run two legs on one machine: the specs share one admin account and the
    # server binds a fixed port.
    name: Real browser critical flows (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: desktop-chromium
            project: desktop-chromium
            browsers: chromium
            engines: chromium
            shard: ''
            prescripts: false
          - leg: mobile-webkit
            project: mobile-webkit
            browsers: chromium webkit
            engines: chromium-webkit
            shard: ''
            prescripts: true
          - leg: mobile-chromium-1
            project: mobile-chromium
            browsers: chromium
            engines: chromium
            shard: 1/3
            prescripts: false
          - leg: mobile-chromium-2
            project: mobile-chromium
            browsers: chromium
            engines: chromium
            shard: 2/3
            prescripts: false
          - leg: mobile-chromium-3
            project: mobile-chromium
            browsers: chromium
            engines: chromium
            shard: 3/3
            prescripts: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: npm ci
      - run: python -m pip install -r server/requirements.txt
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore cached browser engines
        id: engines
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.engines }}
      - name: Install browser engines
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.engines.outputs.cache-hit }}" == "true" ]]; then
            npx playwright install-deps ${{ matrix.browsers }}
          else
            npx playwright install --with-deps ${{ matrix.browsers }}
          fi
      - name: Save browser engines to the cache
        # Saved right after the install, so a red leg still seeds the cache.
        if: ${{ steps.engines.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.engines }}
      - name: Modal presentation, keyboard stability and IndexedDB snapshot checks
        if: ${{ matrix.prescripts }}
        run: npm run test:modal-presentation && npm run test:modal-keyboard-stability && npm run test:indexeddb-snapshot
      - name: Exercise real browser behavior for this leg
        shell: bash
        run: |
          set -euo pipefail
          shard="${{ matrix.shard }}"
          npx playwright test --project="${{ matrix.project }}" ${shard:+--shard="$shard"}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-report-${{ matrix.leg }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  backend:
    # The suite is split by whole test files across three runners (each file
    # seeds its own data; verified by running every file alone). Never run two
    # shards on ONE machine: test_setup_admin.py uses a fixed temp file.
    name: FastAPI tests (${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # The same isolated environment scripts/test-backend.js gives the local
      # run: an in-memory SQLite, no live database or outbound integration.
      DATABASE_URL: 'sqlite+pysqlite:///:memory:'
      ALBAYAN_ALLOW_SQLITE: 'true'
      PYTHONIOENCODING: utf-8
      ALBAYAN_META_ACCESS_TOKEN: ''
      ALBAYAN_META_APP_SECRET: ''
      ALBAYAN_META_BACKGROUND_SYNC: 'false'
      ALBAYAN_META_AUTO_IMPORT: 'false'
      ALBAYAN_COOKIE_SECURE: 'false'
      ALBAYAN_DEBUG_MODE: 'false'
      ALBAYAN_ENABLE_ONLINE_IMPORT: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r server/requirements.txt
      - name: Run this shard of the backend suite
        shell: bash
        # Contiguous alphabetical thirds of server/test_*.py: zero maintenance,
        # and the per-file times are flat enough that the shards stay balanced.
        run: |
          set -euo pipefail
          files="$(python - <<'PY'
          import glob
          files = sorted(glob.glob('server/test_*.py'))
          n, i = 3, ${{ matrix.shard }} - 1
          print(' '.join(files[i * len(files) // n:(i + 1) * len(files) // n]))
          PY
          )"
          echo "shard ${{ matrix.shard }}/3: $(wc -w <<<"$files") files"
          # shellcheck disable=SC2086
          python -m pytest -q -p no:cacheprovider $files

  postgres-migration:
    name: PostgreSQL migration smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: albayan_test_ci
          POSTGRES_USER: albayan
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U albayan -d albayan_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://albayan:ci-only-password@127.0.0.1:5432/albayan_test_ci
      ALBAYAN_TEST_POSTGRES_URL: postgresql+psycopg://albayan:ci-only-password@127.0.0.1:5432/albayan_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install -r server/requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r server/requirements.txt
      - run: python -m alembic upgrade head
      - run: python -m alembic current
      - name: Query migrated PostgreSQL database
        run: python -c "from sqlalchemy import text; from server.db import get_engine; c=get_engine().connect(); print(c.execute(text('SELECT 1')).scalar_one()); c.close()"
      - name: Exercise real PostgreSQL backup and financial workflows
        shell: bash
        # Releases reuse this run as their proof, so a skipped money scenario
        # must fail here (same guard the publisher used to carry).
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider -rs server/test_full_backup_postgres.py server/test_postgres_financial_review.py server/test_postgres_studio_jobs.py | tee "$RUNNER_TEMP/postgres-ci.log"
          if grep -Eq '[0-9]+ (skipped|deselected)' "$RUNNER_TEMP/postgres-ci.log"; then
            echo "::error::PostgreSQL scenarios were skipped; this run cannot prove a release."
            exit 1
          fi
      - name: Build the actual application backup client
        run: docker build --tag albayan-backup-ci --file server/Dockerfile .
      - name: Prove a PostgreSQL backup can be restored
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.tmp/postgres-restore"
          docker run --rm --network host \
            -e PGPASSWORD=ci-only-password \
            -v "$PWD/.tmp/postgres-restore:/backup" \
            --user "$(id -u):$(id -g)" albayan-backup-ci \
            pg_dump --host 127.0.0.1 --username albayan --dbname albayan_test_ci \
              --format custom --no-owner --no-acl --file /backup/albayan.dump
          docker run --rm --network host \
            -e PGPASSWORD=ci-only-password albayan-backup-ci \
            createdb --host 127.0.0.1 --username albayan albayan_restore
          docker run --rm --network host \
            -e PGPASSWORD=ci-only-password \
            -v "$PWD/.tmp/postgres-restore:/backup:ro" \
            albayan-backup-ci \
            pg_restore --host 127.0.0.1 --username albayan --dbname albayan_restore \
              --exit-on-error --no-owner --no-acl /backup/albayan.dump
          docker run --rm --network host \
            -e PGPASSWORD=ci-only-password albayan-backup-ci \
            psql --host 127.0.0.1 --username albayan --dbname albayan_restore \
              --set ON_ERROR_STOP=1 --tuples-only \
              --command "SELECT COUNT(*) FROM alembic_version;"

  container:
    name: Docker production smoke test
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production image
        run: docker build --tag albayan-ci --file server/Dockerfile .
      - name: Start and verify the non-root service
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name albayan-ci \
            --publish 127.0.0.1:18080:8000 \
            --env ALBAYAN_COOKIE_SECURE=false \
            --env ALBAYAN_ALLOW_SQLITE=true \
            --env ALBAYAN_DB_PATH=/tmp/albayan-ci.db \
            albayan-ci
          trap 'docker rm --force albayan-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker logs albayan-ci
              exit 1
            fi
            sleep 1
          done
          test "$(docker exec albayan-ci id -u)" != "0"

  android:
    name: Android lint, tests, and release bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - run: npm run sync:www
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Run Android checks
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug
      - name: Build unsigned release bundle for CI validation only
        working-directory: android
        env:
          ALBAYAN_CI_ALLOW_UNSIGNED_RELEASE_BUNDLE: 'true'
        run: ./gradlew --no-daemon bundleRelease

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run sync:www
      - run: npx cap sync ios
      - name: Build without signing
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/dd"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: The app must launch and stay alive on a simulator
        # Apple's iOS 27 SDK kills apps that still use the old (non-scene)
        # start-up style at launch ("UIScene life cycle is required"); a build
        # alone cannot catch that. Install the simulator build, launch it, and
        # require the process to be alive 20 s later with no such error logged.
        shell: bash
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          for runtime, devices in json.load(sys.stdin)['devices'].items():
              if 'iOS' not in runtime: continue
              for d in devices:
                  if d['name'].startswith('iPhone'): print(d['udid']); sys.exit(0)
          sys.exit('no iPhone simulator available')")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          app="$(find "$RUNNER_TEMP/dd/Build/Products" -name App.app -path '*iphonesimulator*' | head -n 1)"
          xcrun simctl install "$udid" "$app"
          started="$(date '+%Y-%m-%d %H:%M:%S')"
          pid="$(xcrun simctl launch "$udid" com.albayan.app | awk '{print $2}')"
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::The app process died within 20 s of launch."
            xcrun simctl spawn "$udid" log show --start "$started" --predicate 'process == "App"' --style compact | tail -n 40
            exit 1
          fi
          if xcrun simctl spawn "$udid" log show --start "$started" --predicate 'process == "App"' --style compact | grep -q 'UIScene life cycle'; then
            echo "::error::iOS refused the app's start-up style (UIScene life cycle is required)."
            exit 1
          fi
          kill "$pid" || true
      - name: Release configuration must also compile for a real device
        # An App Store archive uses Release; catch Release-only failures here,
        # not in the owner's Xcode. Signing is skipped (no certificates in CI).
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build
